<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Dynamic background animations */
    @keyframes pulse-wave {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.05) translate(-10px, 5px); opacity: 0.6; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
    }
    @keyframes float-pill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes flow-line {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    
    .wave-bg { animation: pulse-wave 8s ease-in-out infinite; transform-origin: center; }
    .pill-1 { animation: float-pill 5s ease-in-out infinite; }
    .pill-2 { animation: float-pill 6s ease-in-out infinite 1s; }
    .pill-3 { animation: float-pill 7s ease-in-out infinite 2s; }
    .flow-path { stroke-dasharray: 20 10; animation: flow-line 15s linear infinite; }
  </style>

  <!-- Dark Rich Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Animated Graph & Grid Lines (Background Layer) -->
  <g opacity="0.25">
    <circle cx="200" cy="80" r="180" fill="url(#accent-glow)" class="wave-bg"/>
    <circle cx="1000" cy="240" r="220" fill="url(#accent-glow)" class="wave-bg"/>
    <path d="M0,220 Q 300,120 600,240 T 1200,160" fill="none" stroke="#6366f1" stroke-width="2" class="flow-path"/>
    <path d="M0,160 Q 400,280 800,140 T 1200,260" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-path"/>
  </g>

  <!-- Background Decorative Floating Micro Cards (Behind text focus) -->
  <g transform="translate(900, 50)" class="pill-1" opacity="0.7">
    <rect width="220" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#0284c7"/>
    <text x="54" y="28" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="bold">Banking APIs</text>
    <text x="54" y="44" font-family="sans-serif" font-size="10" fill="#38bdf8">Accounts &amp; Wires</text>
  </g>

  <g transform="translate(950, 130)" class="pill-2" opacity="0.7">
    <rect width="200" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#16a34a"/>
    <text x="54" y="28" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="bold">Card Issuing</text>
    <text x="54" y="44" font-family="sans-serif" font-size="10" fill="#4ade80">Virtual &amp; Physical</text>
  </g>

  <g transform="translate(880, 210)" class="pill-3" opacity="0.7">
    <rect width="240" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="14" fill="#9333ea"/>
    <text x="54" y="28" font-family="sans-serif" font-size="12" fill="#e2e8f0" font-weight="bold">Ledger &amp; Payments</text>
    <text x="54" y="44" font-family="sans-serif" font-size="10" fill="#c084fc">Double-entry Engine</text>
  </g>

  <!-- Foreground Title and Subtitle Content -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="320" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
      <text x="16" y="21" class="badge-text">🚀 Curated Fintech Ecosystem 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title" filter="url(#glow)">Awesome Embedded Finance</text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">SaaS Platforms, BaaS APIs &amp; Open-Source Financial Infrastructure</text>

    <!-- Tech tags -->
    <g transform="translate(0, 225)">
      <rect x="0" y="0" width="110" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" fill="#38bdf8">💳 Card Issuing</text>

      <rect x="120" y="0" width="125" height="28" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
      <text x="132" y="18" font-family="sans-serif" font-size="12" fill="#818cf8">🏦 Core Banking</text>

      <rect x="255" y="0" width="115" height="28" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
      <text x="267" y="18" font-family="sans-serif" font-size="12" fill="#c084fc">📊 Ledgers &amp; BaaS</text>

      <rect x="380" y="0" width="125" height="28" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="1"/>
      <text x="392" y="18" font-family="sans-serif" font-size="12" fill="#4ade80">⚡ Open Source</text>
    </g>
  </g>
</svg>
